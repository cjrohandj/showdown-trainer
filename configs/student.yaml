seed: 1337

device: auto
torch_num_threads: 8

model:
  hidden_sizes: [512, 256]
  dropout: 0.1
  hash_buckets: 2048

training:
  data_path: training_data/mcts_run.jsonl
  output_path: checkpoints/policy_mlp.pt
  resume_checkpoint_path:
  epochs: 8
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  validation_split: 0.1
  num_workers: 0
  use_result_join: true
  save_best_only: false
  grad_clip_norm: 1.0

  # Optional update-based training. Leave null to train by epochs.
  updates: null
  eval_every: 100
  smoke_epochs: 1
  smoke_updates: 20
  smoke_eval_every: 10

collection:
  enabled: true
  output_path: training_data/mcts_run.jsonl
  run_id: showdex-poke-engine-mcts
  strict: false
  include_state: true
  pokemon_format: gen9randombattle
  generation: gen9
  seed: 1337
  positions: 5000
  search_time_ms: 225
  threads: 4
  hypotheses: 4
  backend: poke-engine
  retry_limit: 10

  showdex:
    data_dir: showdex_cache
    randoms_preset_path: showdex_cache/gen9randombattle.json
    randoms_stats_path: showdex_cache/gen9randombattle-stats.json
    prefer_stats: true
    use_embedded_fixture: false
    reveal_opponent_set: false
